[package]
name = "cosmic-mail"
version = "0.1.0"
description = "A native Linux mail client for omarchy, built with Rune"
authors = ["Harry Leach <harry@pluscosmic.dev>"]
publish = false
edition = "2021"

[lib]
name = "cosmic_mail"
path = "src/lib.rs"

[[bin]]
name = "cosmic-mail"
path = "src/main.rs"

[build-dependencies]
# Embeds assets/icon.ico in the Windows executable (build.rs; no-op elsewhere).
winresource = "0.1"

[dependencies]
# Native GPU UI (wgpu + winit). Pre-release: pin a rev of `dev` (never rewritten). It must be
# the revision rune-theme-foundation pins (ui-foundation's rune/Cargo.toml), or Cargo builds two
# Runes whose types don't meet; move both together.
rune = { git = "https://github.com/anomalyco/rune", rev = "cd36f5a9917ec4a65786caf69213c9cc32919984" }
# The UI foundation's colour schemes, fonts and type as a Rune theme (PlusCosmic/ui-foundation).
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "cd36f5a9917ec4a65786caf69213c9cc32919984" }
rune-theme-foundation = { git = "https://github.com/PlusCosmic/ui-foundation", rev = "9d39c0a4f66eb97284c4bee3990bf166ca7657c9" }
# Decodes the bundled PNG icon into RGBA for the tray.
png = "0.18"
# Renders sanitized HTML mail as styled text (Rune has no HTML engine).
html2text = { version = "0.15", features = ["css"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
async-imap = { version = "0.11.2", default-features = false, features = ["runtime-tokio"] }
# Named directly (already pulled in transitively by async-imap, pinned to the
# same 2.x line it resolves) so sync/mod.rs can drain `Session::unsolicited_responses`
# by its real receiver type instead of going through async-imap's session API.
async-channel = "2.5.0"
tokio-rustls = "0.26.4"
rustls-native-certs = "0.8.4"
# Used only by the debug-only COSMIC_MAIL_EXTRA_CA hook in sync/imap.rs (E2E tests).
rustls-pemfile = "2"
mail-parser = "0.11.5"
dirs = "6.0.0"
anyhow = "1.0.103"
thiserror = "2.0.18"
base64 = "0.22.1"
url = "2.5.8"
rusqlite = { version = "0.40.1", features = ["bundled"] }
notify-rust = "4.18.0"
chrono = { version = "0.4.45", features = ["serde"] }
oauth2 = "5.0.0"
lettre = { version = "0.11.22", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
keyring = { version = "4.1.4", features = ["v1"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2", "charset"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
futures = "0.3"
rustls = { version = "0.23.41", features = ["ring"] }
roxmltree = "0.21.1"
hickory-resolver = "0.26.1"
# TCP keepalive on the IMAP socket (issue #41): applied to the `tokio::net::TcpStream`
# before the TLS handshake in `sync::imap::tls_client`. `feature = "all"` is required
# for `TcpKeepalive::with_retries` (TCP_KEEPCNT) — see the vendored source for which
# setters are gated per-platform; this project only targets Linux, where all three
# (time/interval/retries) are available.
socket2 = { version = "0.6.4", features = ["all"] }
# HTML mail layout (ui::mail_doc). Beta: pinned exactly. stylo's build script needs Python 3.
blitz-dom = { version = "=0.3.0-beta.4", default-features = false }
blitz-html = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
parley = { version = "0.12", default-features = false }
taffy = { version = "0.15", default-features = false }
stylo = { version = "=0.22.0", default-features = false }

[profile.dev.package."*"]
# Dependencies (wgpu, parley, ...) build without debug info: much faster links.
debug = false

# blitz-dom forces taffy's `flexbox_balance` feature, which adds FlexWrap variants rune-taffy
# matches exhaustively. Rune's crate at the pinned rev plus a catch-all arm; re-copy it when
# bumping the Rune rev (GOTCHAS, "Blitz").
[patch."https://github.com/anomalyco/rune"]
rune-taffy = { path = "vendor/rune-taffy" }
