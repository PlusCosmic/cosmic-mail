[package]
name = "cosmic-mail"
version = "0.1.0"
description = "A native Linux mail client for omarchy, built with Tauri"
authors = ["Harry Leach <harry@pluscosmic.dev>"]
publish = false
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cosmic_mail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
async-imap = { version = "0.11.2", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = "0.26.4"
rustls-native-certs = "0.8.4"
# Used only by the debug-only COSMIC_MAIL_EXTRA_CA hook in sync/imap.rs (E2E tests).
rustls-pemfile = "2"
mail-parser = "0.11.5"
toml = "1.1.2"
dirs = "6.0.0"
anyhow = "1.0.103"
thiserror = "2.0.18"
base64 = "0.22.1"
url = "2.5.8"
rusqlite = { version = "0.40.1", features = ["bundled"] }
notify-rust = "4.18.0"
notify = "8.2.0"
chrono = { version = "0.4.45", features = ["serde"] }
oauth2 = "5.0.0"
lettre = { version = "0.11.22", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
keyring = { version = "4.1.4", features = ["v1"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2", "charset"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
futures = "0.3"
rustls = { version = "0.23.41", features = ["ring"] }
roxmltree = "0.21.1"
hickory-resolver = "0.26.1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
