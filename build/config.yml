# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
version: '3'

# This information is used to generate the build assets. `info.version` is the
# version of record: the release workflow reads it, and frontend/package.json
# tracks it.
info:
  companyName: "PlusCosmic" # The name of the company
  productName: "Cosmic Mail" # The name of the application
  productIdentifier: "dev.pluscosmic.mail" # The unique product identifier
  description: "A native Linux mail client for omarchy" # The application description
  copyright: "(c) 2026, Harry Leach" # Copyright text
  comments: "https://github.com/PlusCosmic/cosmic-mail" # Comments
  version: "0.1.0" # The application version

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - e2e
      - docs
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory will be excluded entirely by the setting above.
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

# File Associations
fileAssociations: []

# Other data
other: []
