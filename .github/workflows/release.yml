name: release

# Runs the definition-of-done suite on every merge to main and, only if it
# passes, asks PlusCosmic/packages to build and publish an Arch package. This
# repository never writes to the package bucket: a single repository owns every
# index update so that concurrent publishes cannot drop entries from the shared
# database. See docs/RELEASING.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

# pkgrel is the packaging repository's run number, so it orders packages by when
# they were dispatched rather than by when they were committed. Two merges
# landing within the verify window could otherwise finish out of order and hand
# the older commit the higher pkgrel, offering it to clients as an upgrade over
# the newer one. Superseding a run cancels it, so only the newest commit on the
# branch ever reaches the dispatch.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Wails 3 links webkit2gtk-4.1 with the gtk3 build tag; every Go step
      # below passes it, matching what the Arch package builds.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - run: npm ci
        working-directory: frontend

      # The definition of done from CLAUDE.md, in the same order. A change that
      # compiles but fails these must not reach a client as an upgrade.
      - run: npm run check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend

      # frontend/bindings is generated from app.go and internal/models and is
      # committed so the frontend checks above need no Go toolchain. A stale
      # copy means the frontend was checked against the wrong API.
      - name: Check the committed bindings are current
        run: |
          go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
          wails3 generate bindings -ts -i -clean=true -d frontend/bindings -f "-tags gtk3"
          git diff --exit-code -- frontend/bindings

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet -tags gtk3 ./...
      - run: go test -tags gtk3 ./...
      - run: go build -tags gtk3,production -trimpath -buildvcs=false -ldflags="-w -s" -o bin/cosmic-mail .

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse anything but the current tip of main
        run: |
          # pkgrel is the packaging repository's run number, so any dispatch
          # outranks every package already published — including one built from
          # code that is not on main. There are two ways in: workflow_dispatch
          # takes whichever ref it is launched from, and re-running an old run
          # replays that run's original SHA. Either would reach clients as an
          # upgrade, nothing prunes a bad package from the bucket, and undoing
          # one means bumping the version to supersede it. Cheaper to refuse.
          #
          # This fails rather than skipping: a manual run from a branch is
          # someone trying to publish, and a silent success would look like it
          # worked. The verify job above still runs, so it is usable as a check.
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "release publishes from main only; this run is on $GITHUB_REF" >&2
            exit 1
          fi

          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "main has moved to $tip; this run is for $GITHUB_SHA." >&2
            echo "That commit's own run publishes it — do not replay this one." >&2
            exit 1
          fi

      - name: Dispatch to the packaging repository
        env:
          # Fine-grained PAT with contents:write on PlusCosmic/packages;
          # GITHUB_TOKEN cannot dispatch across repositories.
          GH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
        run: |
          # build/config.yml is the version of record, matching
          # scripts/promote-local.sh; frontend/package.json tracks it but is
          # not what the packaging repository reads.
          version=$(sed -n 's/^  version: *"\([^"]*\)".*/\1/p' build/config.yml)
          test -n "$version" || { echo "no version in build/config.yml" >&2; exit 1; }

          gh api repos/PlusCosmic/packages/dispatches \
            -f event_type=publish \
            -f "client_payload[package]=cosmic-mail" \
            -f "client_payload[repository]=$GITHUB_REPOSITORY" \
            -f "client_payload[ref]=$GITHUB_SHA" \
            -f "client_payload[version]=$version"

          echo "Dispatched cosmic-mail $version at $GITHUB_SHA" \
            >> "$GITHUB_STEP_SUMMARY"
