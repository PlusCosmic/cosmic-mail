name: windows

# Windows build. On every pull request and push it builds natively and, in
# parallel, runs the test suite (the UI tests run on Rune's headless runtime, no
# GPU needed), and packages an installer and a portable zip. On pushes to main it also publishes
# them as a GitHub Release. See docs/RELEASING.md ("Windows").

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Two merges in quick succession each get their own release; never cancel a
# run that may be publishing.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tests and the release build compile different profiles, so they run side
  # by side; the release job waits for both.
  test:
    runs-on: windows-latest
    env:
      # aws-lc-sys (via reqwest/oauth2) needs NASM on x86_64 MSVC unless it
      # may use its prebuilt objects; the runner has no NASM.
      AWS_LC_SYS_PREBUILT_NASM: "1"
      # No debug info in CI test builds: far less to write and link.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      # The toolchain comes from rust-toolchain.toml (Rune pins it).
      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # The library holds every test that runs (unit + UI behaviour tests on
      # Rune's headless runtime). tests/e2e_greenmail.rs is #[ignore]d and needs
      # the Linux GreenMail fixture, so it isn't built here.
      - name: Test
        run: cargo test --locked --lib

  build:
    runs-on: windows-latest
    env:
      AWS_LC_SYS_PREBUILT_NASM: "1"
      CARGO_TERM_COLOR: always
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/version.sh counts commits, so it needs the whole history.
          fetch-depth: 0

      # MAJOR.MINOR from Cargo.toml, PATCH = commit count (scripts/version.sh).
      # The build embeds it (cosmic_mail::VERSION, the exe's version info).
      - name: Compute the version
        id: version
        shell: bash
        run: |
          version=$(scripts/version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "COSMIC_MAIL_VERSION=$version" >> "$GITHUB_ENV"
          echo "Version: $version"

      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --locked --release

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after install" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package the installer and the portable zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $dist = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          & $env:ISCC "/DAppVersion=$version" `
            "/DSourceExe=$PWD\target\release\cosmic-mail.exe" `
            "/DOutputDir=$dist" packaging\windows\cosmic-mail.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

          $portable = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item target\release\cosmic-mail.exe $portable
          Copy-Item LICENSE (Join-Path $portable "LICENSE.txt")
          Compress-Archive -Path "$portable\*" `
            -DestinationPath "$dist\cosmic-mail-$version-windows-x64-portable.zip"
          Get-ChildItem $dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: cosmic-mail-windows
          path: dist/*
          if-no-files-found: error

  release:
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cosmic-mail-windows
          path: dist

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # One release per push to main, tagged with its version
          # (scripts/version.sh: each merge raises the patch).
          tag="v${VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists (a re-run); nothing to publish."
            exit 0
          fi
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          notes="Automatic build of \`main\` at ${short} (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}).

          - **Installer**: \`*-setup.exe\` (per-user, no administrator prompt; optional start at sign-in).
          - **Portable**: \`*-portable.zip\` (unzip and run \`cosmic-mail.exe\`).

          Builds are unsigned, so Windows SmartScreen warns on first run (More info → Run anyway)."
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Cosmic Mail ${VERSION}" \
            --notes "$notes" \
            --latest
