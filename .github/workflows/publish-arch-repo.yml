name: publish-arch-repo

# Every merge to main builds an Arch package and publishes it to a private
# pacman repository on Backblaze B2. The repo is public-but-unlisted: access
# control is the unguessable bucket name and path prefix, nothing more.
# Client setup and the trust tradeoff are documented in docs/RELEASING.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

# The repo database is a read-modify-write cycle over shared object storage.
# Two concurrent publishes would lose one of the packages from the index.
concurrency:
  group: arch-repo-publish
  cancel-in-progress: false

env:
  REPO_NAME: cosmic
  # The bucket name is guessable, so the random path segment is the only thing
  # keeping the repository unlisted. Do not shorten or prettify it.
  B2_PATH: b2:pluscosmic-packages-bucket/bx2fuafngntes/x86_64
  RCLONE_CONFIG_B2_TYPE: b2
  RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.B2_KEY_ID }}
  RCLONE_CONFIG_B2_KEY: ${{ secrets.B2_APP_KEY }}

jobs:
  publish:
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm --needed \
            git rclone nodejs npm rust \
            webkit2gtk-4.1 gtk3 libayatana-appindicator libsecret

      - uses: actions/checkout@v4

      - name: Configure build user
        run: |
          # makepkg refuses to run as root; -s needs passwordless pacman.
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Stage the build tree
        id: stage
        run: |
          PKGVER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          # run_number is strictly increasing, so every merge is an upgrade even
          # when tauri.conf.json's version is unchanged.
          PKGREL=${{ github.run_number }}

          install -d -o builder -g builder /tmp/build
          git archive --format=tar.gz --prefix=src/ \
            -o "/tmp/build/cosmic-mail-$PKGVER.tar.gz" HEAD
          cp packaging/{PKGBUILD,cosmic-mail.desktop,cosmic-mail.service,cosmic-mail.install} \
            /tmp/build/
          chown -R builder:builder /tmp/build

          echo "pkgver=$PKGVER" >> "$GITHUB_OUTPUT"
          echo "pkgrel=$PKGREL" >> "$GITHUB_OUTPUT"

      - name: Build package
        id: build
        working-directory: /tmp/build
        run: |
          sudo -u builder \
            env PKGVER='${{ steps.stage.outputs.pkgver }}' \
                PKGREL='${{ steps.stage.outputs.pkgrel }}' \
            makepkg -sf --noconfirm
          echo "pkg=$(ls /tmp/build/*.pkg.tar.zst)" >> "$GITHUB_OUTPUT"

      - name: Publish
        working-directory: /tmp/build
        run: |
          pkg='${{ steps.build.outputs.pkg }}'
          entry="$(basename "$pkg")"
          entry="${entry%-x86_64.pkg.tar.zst}"

          # Package first: an index naming a file that is not uploaded yet makes
          # every client's next -Syu fail on a 404.
          rclone copy "$pkg" "$B2_PATH/"

          # Updating the index is a read-modify-write over shared storage, and
          # the concurrency group above only serialises publishes from this
          # repository. Another project publishing into the same database within
          # this window would drop this entry, so re-read the uploaded index and
          # redo the merge if it is missing.
          for attempt in 1 2 3; do
            rm -f "$REPO_NAME".db* "$REPO_NAME".files*

            # Only the index is pulled down; the package archive stays remote.
            rclone copy "$B2_PATH/$REPO_NAME.db.tar.gz" . 2>/dev/null \
              || echo "no existing database — bootstrapping a new repository"
            repo-add "$REPO_NAME.db.tar.gz" "$pkg"

            # repo-add leaves .db/.files as symlinks. Object storage has no
            # symlinks, so publish the resolved tarballs under the bare names
            # pacman actually requests.
            cp "$REPO_NAME.db.tar.gz" "$REPO_NAME.db"
            cp "$REPO_NAME.files.tar.gz" "$REPO_NAME.files"
            for f in "$REPO_NAME.db.tar.gz" "$REPO_NAME.files.tar.gz" \
                     "$REPO_NAME.db" "$REPO_NAME.files"; do
              rclone copy "$f" "$B2_PATH/"
            done

            if rclone cat "$B2_PATH/$REPO_NAME.db.tar.gz" | tar tz \
                 | grep -q "^$entry/"; then
              echo "index confirmed on attempt $attempt"
              exit 0
            fi
            echo "index did not contain $entry; retrying" >&2
            sleep 5
          done

          echo "could not get $entry into the index after 3 attempts" >&2
          exit 1

      - name: Summary
        run: |
          echo "Published \`$(basename '${{ steps.build.outputs.pkg }}')\`" \
            >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Update a client with `sudo pacman -Syu`.' >> "$GITHUB_STEP_SUMMARY"
