name: e2e

# End-to-end tests: drive the real app (WebKitGTK under Xvfb) through the
# development-build automation bridge against a hermetic GreenMail fixture. No
# real mailbox, no secrets. See e2e/README.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Wails 3 links webkit2gtk-4.1 with the gtk3 build tag, matching the
      # Arch package.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb dbus-x11

      - run: npm ci
        working-directory: frontend

      - name: Start + seed the GreenMail fixture
        run: npm run e2e:env:up
        working-directory: frontend

      # Development build (no `production` tag) -> the automation bridge and
      # the fixture env hooks are compiled in; the frontend is built + embedded.
      - name: Build development app binary
        run: |
          npm run build
          cd .. && go build -tags gtk3 -buildvcs=false -o bin/cosmic-mail .
        working-directory: frontend

      - name: Run E2E suite (headless)
        run: dbus-run-session -- xvfb-run -a e2e/ci-run.sh
        env:
          # Headless-WebKitGTK stability flags.
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"

      - name: Tear down the fixture
        if: always()
        run: npm run e2e:env:down
        working-directory: frontend
