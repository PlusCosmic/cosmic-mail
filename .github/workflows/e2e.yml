name: e2e

# End-to-end tests: drive the real Rune UI over the real backend against a
# hermetic GreenMail fixture (tests/e2e_greenmail.rs). Rune's headless runtime
# draws and routes input without a window or GPU, so no display server is
# needed. No real mailbox, no secrets. See e2e/README.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libdbus-1-dev

      # The toolchain comes from rust-toolchain.toml (Rune pins it).
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Start + seed the GreenMail fixture
        run: |
          docker compose -f e2e/docker-compose.yml up -d
          node e2e/seed.mjs

      # Debug profile: the COSMIC_MAIL_EXTRA_CA / COSMIC_MAIL_TEST_IMAP_PASSWORD
      # hooks the test sets are compiled in only there.
      - name: Run the E2E suite
        run: cargo test --test e2e_greenmail -- --ignored

      - name: Tear down the fixture
        if: always()
        run: docker compose -f e2e/docker-compose.yml down -v
