name: e2e

# End-to-end tests: drive the real app (WebKitGTK under Xvfb) through the debug
# automation bridge against a hermetic GreenMail fixture. No real mailbox, no
# secrets. See e2e/README.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            xvfb \
            dbus-x11

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Start + seed the GreenMail fixture
        run: npm run e2e:env:up

      # Debug profile -> the automation bridge is compiled in; --no-bundle skips
      # deb/appimage packaging; the frontend is built + embedded by tauri build.
      - name: Build debug app binary
        run: npm run tauri build -- --debug --no-bundle

      - name: Run E2E suite (headless)
        run: dbus-run-session -- xvfb-run -a e2e/ci-run.sh
        env:
          # Headless-WebKitGTK stability flags.
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"

      - name: Tear down the fixture
        if: always()
        run: npm run e2e:env:down
